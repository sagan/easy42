syntax = "proto3";

package easy42.agent.v1;

option go_package = "easy42/internal/agent/proto;agentpb";

// AgentMessage is the top-level envelope for all WebSocket messages.
message AgentMessage {
  uint64 seq = 1;
  int64 timestamp = 2; // Unix timestamp in milliseconds

  oneof payload {
    // Agent -> Server
    RegisterRequest register_req = 10;
    Heartbeat heartbeat = 11;
    TelemetryReport telemetry = 12;
    CommandResponse command_resp = 13;
    ProbeResponse probe_resp = 14;
    CronTaskReport cron_task_report = 15;

    // Server -> Agent
    RegisterResponse register_resp = 20;
    HeartbeatAck heartbeat_ack = 21;
    CommandRequest command_req = 22;
    SyncCronTasks sync_cron_tasks = 23;
    SyncHosts sync_hosts = 24;
  }
}

// ----------------- Registration & Handshake -----------------

message RegisterRequest {
  string node_name = 1;
  string agent_version = 2;
  string os_info = 3;
  string hostname = 4;
  string hosts_hash = 5;
}

message RegisterResponse {
  bool success = 1;
  string error_message = 2;
  uint32 telemetry_interval_secs = 3; // Reporting interval in seconds (e.g. 10)
}

// ----------------- Heartbeats -----------------

message Heartbeat {
  int64 client_time = 1;
  string hosts_hash = 2;
}

message HeartbeatAck {
  int64 server_time = 1;
}

// ----------------- Telemetry & Metrics -----------------

message TelemetryReport {
  SystemMetrics system = 1;
  repeated InterfaceMetrics interfaces = 2;
  repeated WgPeerMetrics wg_peers = 3;
  repeated BirdProtocolStatus bird_protocols = 4;
  repeated DiskMetrics disks = 5;
  string hosts_hash = 6;
}

message DiskMetrics {
  string path = 1;
  uint64 total_bytes = 2;
  uint64 used_bytes = 3;
  uint64 free_bytes = 4;
}

message SystemMetrics {
  float cpu_percent = 1;
  uint64 memory_used_bytes = 2;
  uint64 memory_total_bytes = 3;
  uint64 uptime_seconds = 4;
  repeated float load_avg = 5; // [1m, 5m, 15m]
}

message InterfaceMetrics {
  string name = 1;
  bool is_up = 2;
  uint64 rx_bytes = 3;
  uint64 tx_bytes = 4;
  uint64 rx_packets = 5;
  uint64 tx_packets = 6;
  uint64 rx_errors = 7;
  uint64 tx_errors = 8;
  repeated string addresses = 9;
  uint32 flags = 10; // Bit 0: Primary, Bit 1: Physical
}

message WgPeerMetrics {
  string interface_name = 1;
  string public_key = 2;
  string endpoint = 3;
  int64 last_handshake_time = 4; // Unix epoch seconds
  uint64 rx_bytes = 5;
  uint64 tx_bytes = 6;
  int64 persistent_keepalive = 7;
}

message BirdProtocolStatus {
  string name = 1;
  string proto = 2;  // e.g. "BGP", "Kernel", "Device"
  string state = 3;  // e.g. "up", "down", "start"
  string info = 4;   // e.g. "Established", "Connect", "Passive"
}

// ----------------- Commands & RPC -----------------

message CommandRequest {
  string request_id = 1;

  oneof command {
    ApplyConfigFile apply_config = 10;
    ManageInterface manage_iface = 11;
    ReloadBirdCmd reload_bird = 12;
    ApplyNftablesCmd apply_nft = 13;
    LookingGlassCmd looking_glass = 14;
    ProbeSystemCmd probe_system = 15;
    RestartServiceCmd restart_service = 16;
    FlushCacheCmd flush_cache = 17;
    SyncHostsCmd sync_hosts = 18;
    SyncActionCmd sync_action = 19;
  }
}

message SyncActionCmd {
  string action_type = 1;        // e.g. "sync_wg", "sync_bird", "sync_nftables", "sync_roa", "sync_hosts", "delete_wg", "down_wg"
  string interface_name = 2;     // Interface name (e.g. wg42peer)
  string target_file = 3;        // Destination path (e.g. /etc/wireguard/wg42peer.conf)
  bytes file_content = 4;        // Config file content to write
  uint32 file_mode = 5;          // e.g. 0600, 0644, 0755
  string sha256_hash = 6;        // Optional SHA-256 hash for verification
  repeated HostRecord hosts = 7; // For sync_hosts
  string description = 8;        // Action description
  string diff_status = 9;        // "create" | "update" | "delete" | "synced"
}

message ApplyConfigFile {
  string path = 1;        // Destination path (e.g. /etc/wireguard/wg42peer.conf)
  bytes content = 2;      // File content
  uint32 file_mode = 3;   // e.g. 0600 or 0644
  string sha256_hash = 4; // Expected SHA-256 for verification
}

message ManageInterface {
  string interface_name = 1;
  enum Action {
    UP = 0;
    DOWN = 1;
    RESTART = 2;
    SYNC_WG = 3;
    DELETE = 4;
  }
  Action action = 2;
  string config_file = 3; // Optional path to wg config for SYNC_WG
}

message ReloadBirdCmd {
  bool check_only = 1;
}

message ApplyNftablesCmd {
  string script_path = 1;
}

message LookingGlassCmd {
  enum Tool {
    PING = 0;
    TRACEROUTE = 1;
    BIRDC = 2;
    CUSTOM = 3;
    TCP_PING = 4;
  }
  Tool tool = 1;
  string target = 2;
  repeated string args = 3;
  uint32 timeout_seconds = 4;
  string command = 5;
  string interface = 6;
}

message ProbeSystemCmd {}

message FlushCacheCmd {}

message RestartServiceCmd {
  string service_name = 1; // "wireguard", "bird"
}

// ----------------- Responses -----------------

message CommandResponse {
  string request_id = 1;
  bool success = 2;
  int32 exit_code = 3;
  string stdout = 4;
  string stderr = 5;
  uint64 duration_ms = 6;
}

message ProbeResponse {
  string request_id = 1;
  string hostname = 2;
  repeated InterfaceMetrics interfaces = 3;
}

// ----------------- Cron Tasks -----------------

message SyncCronTasks {
  repeated CronTaskSpec tasks = 1;
}

message CronTaskSpec {
  string task_id = 1;
  string name = 2;
  string task_type = 3; // "ping" or "tcp_ping"
  string cron_expr = 4;
  string target = 5;
  uint32 count = 6;
  uint32 timeout_seconds = 7;
  map<string, string> params = 8;
}

message CronTaskReport {
  string task_id = 1;
  string node_name = 2;
  int64 executed_at = 3; // Unix timestamp in seconds
  int32 exit_code = 4;
  uint64 duration_ms = 5;
  string raw_output = 6;
  string error_message = 7;
}

// ----------------- Host Management -----------------

message HostRecord {
  string name = 1;
  string ip = 2;
}

message SyncHosts {
  repeated HostRecord hosts = 1;
}

message SyncHostsCmd {
  repeated HostRecord hosts = 1;
}


