[package]
name = "easy42-agent"
version = "0.1.0"
edition = "2021"
authors = ["Easy42 Team"]
description = "Lightweight high-performance node agent for Easy42"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "fs", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1.0"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3.3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
